<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Разметка названий</title>
  <style>
    :root { --bg:#10151d; --soft:#1b2431; --line:#2c3644; --text:#e7eef6; --muted:#93a4b8; --accent:#66c0f4; --good:#58d68d; --bad:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text);
           font:15px/1.4 system-ui, 'Segoe UI', Roboto, sans-serif; }
    header { display:flex; align-items:center; gap:12px; flex-wrap:wrap;
             padding:10px 14px; border-bottom:1px solid var(--line); background:var(--soft); }
    h1 { margin:0; font-size:16px; }
    .grow { flex:1; }
    button { font:inherit; font-weight:600; padding:8px 13px; border-radius:10px;
             border:1px solid var(--line); background:var(--bg); color:var(--text); cursor:pointer; }
    button:hover:not(:disabled) { border-color:var(--accent); }
    button:disabled { opacity:.4; cursor:default; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#04121e; }
    button.on { background:var(--bad); border-color:var(--bad); color:#fff; }
    .stat { color:var(--muted); font-size:13px; }
    .stat b { color:var(--text); }
    main { padding:14px; display:flex; flex-direction:column; align-items:center; gap:10px; }
    .stage { position:relative; line-height:0; max-width:100%;
             border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#0c1017; }
    .stage img { display:block; max-width:100%; max-height:66vh; user-select:none; -webkit-user-drag:none; }
    .box { position:absolute; border:2px solid var(--accent);
           background:rgba(102,192,244,.28); cursor:pointer; }
    .box:hover { background:rgba(255,107,107,.35); border-color:var(--bad); }
    .box::after { content:'×'; position:absolute; top:-2px; right:2px;
                  font-size:13px; font-weight:800; color:#fff; }
    .hint { color:var(--muted); font-size:13px; text-align:center; max-width:680px; }
    .meta { color:var(--muted); font-size:13px; text-align:center; }
    .meta b { color:var(--text); }
    kbd { background:var(--soft); border:1px solid var(--line); border-radius:5px;
          padding:1px 5px; font:inherit; font-size:12px; }
    .done { color:var(--good); font-weight:700; }
    select { font:inherit; padding:5px 8px; border-radius:8px;
             border:1px solid var(--line); background:var(--bg); color:var(--text); }
    .stage.is-skipped { opacity:.45; outline:2px solid var(--bad); }
    #saveState { font-size:13px; color:var(--muted); min-width:90px; }
  </style>
</head>
<body>
  <header>
    <h1>Разметка названий</h1>
    <label class="stat">Набор:
      <select id="kind">
        <option value="icon">Иконки</option>
        <option value="shot">Скриншоты</option>
      </select>
    </label>
    <label class="stat">Тир:
      <select id="tier">
        <option value="1">1 — топовые</option>
        <option value="2">2 — известные</option>
        <option value="3">3 — средние</option>
        <option value="4">4 — нишевые</option>
        <option value="all">все</option>
      </select>
    </label>
    <span class="stat">С рамками: <b id="progress">0/0</b></span>
    <span class="stat">Брак: <b id="skipped">0</b></span>
    <span class="grow"></span>
    <span id="saveState"></span>
    <button id="prev" type="button">← Назад</button>
    <button id="next" type="button">Вперёд →</button>
    <button id="clean" type="button">Без правок</button>
    <button id="skip" type="button">Брак</button>
    <button id="save" class="primary" type="button">Сохранить</button>
  </header>

  <main>
    <p class="hint">
      Обведи <b>название игры</b> на картинке, если оно видно — иначе ответ спойлерится.
      Чистый арт-логотип без текста трогать не нужно. Клик по рамке — удалить.
      <kbd>←</kbd> <kbd>→</kbd> — листать, <kbd>X</kbd> — брак,
      <kbd>C</kbd> — без правок, <kbd>Ctrl</kbd>+<kbd>S</kbd> — сохранить.
    </p>
    <div class="stage" id="stage">
      <img id="photo" alt="">
    </div>
    <p class="meta" id="meta"></p>
  </main>

<script type="module">
const IMG = { icon: '/img/icons/', shot: '/img/shots/' };
const $ = (id) => document.getElementById(id);
const stage = $('stage');
const photo = $('photo');

/** Данные по наборам. */
const sets = { icon: [], shot: [] };
let gameById = new Map();
/** Активный набор и его отфильтрованный список показа. */
let items = [];
let idx = 0;
let dirty = false;
/** Изменённые файлы по наборам — сохраняем только их. */
const touched = { icon: new Set(), shot: new Set() };

const item = () => items[idx];
const curKind = () => $('kind').value;

async function load() {
  const [gamesRes, iconsRes, shotsRes] = await Promise.all([
    fetch('/data/games.json', { cache: 'no-cache' }),
    fetch('/data/icons.json', { cache: 'no-cache' }).catch(() => null),
    fetch('/data/shots.json', { cache: 'no-cache' }).catch(() => null),
  ]);
  if (!gamesRes.ok) {
    $('meta').textContent = 'Не удалось загрузить games.json — запусти npm run serve из корня.';
    return;
  }
  const { games } = await gamesRes.json();
  gameById = new Map(games.map((g) => [g.id, g]));

  if (iconsRes?.ok) sets.icon = (await iconsRes.json()).icons ?? [];
  if (shotsRes?.ok) sets.shot = (await shotsRes.json()).shots ?? [];
  for (const list of [sets.icon, sets.shot]) {
    for (const it of list) if (!Array.isArray(it.blur)) it.blur = [];
  }
  applyFilter();
}

const tierOf = (it) => gameById.get(it.gameId)?.tier ?? 3;
const gameName = (it) => gameById.get(it.gameId)?.name ?? it.gameId;

/** Пересобирает список показа по набору и тиру, сортируя по тиру и названию. */
function applyFilter() {
  const want = $('tier').value;
  items = sets[curKind()]
    .filter((it) => want === 'all' || String(tierOf(it)) === want)
    .sort(
      (a, b) =>
        tierOf(a) - tierOf(b) ||
        gameName(a).localeCompare(gameName(b), 'ru') ||
        a.file.localeCompare(b.file),
    );

  if (!items.length) {
    $('meta').textContent = 'В этом наборе/тире нет картинок.';
    stage.style.display = 'none';
    return;
  }
  stage.style.display = '';
  idx = 0;
  render();
}

function renderProgress() {
  const withBoxes = items.filter((it) => it.blur.length && !it.skip).length;
  $('progress').textContent = `${withBoxes}/${items.length}`;
  $('skipped').textContent = String(items.filter((it) => it.skip).length);
}

function renderBoxes() {
  for (const b of [...stage.querySelectorAll('.box')]) b.remove();
  const w = photo.clientWidth;
  const h = photo.clientHeight;

  item().blur.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'box';
    div.style.left = `${r.x * w}px`;
    div.style.top = `${r.y * h}px`;
    div.style.width = `${r.w * w}px`;
    div.style.height = `${r.h * h}px`;
    div.title = 'Удалить рамку';
    div.addEventListener('click', (e) => {
      e.stopPropagation();
      item().blur.splice(i, 1);
      mark();
      render();
    });
    stage.append(div);
  });
}

function render() {
  const it = item();
  renderProgress();
  const g = gameById.get(it.gameId);
  $('meta').innerHTML =
    `<b>${idx + 1}/${items.length}</b> · <b>${gameName(it)}</b>` +
    ` (${g?.genre ?? '—'}, тир ${tierOf(it)})` +
    ` · рамок: <b>${it.blur.length}</b>` +
    (it.skip ? ' · <b>брак, в игру не попадёт</b>' : '') +
    (it.clean && !it.blur.length ? ' · <b>без правок</b>' : '');
  $('prev').disabled = idx === 0;
  $('next').disabled = idx === items.length - 1;
  $('skip').classList.toggle('on', Boolean(it.skip));
  $('clean').classList.toggle('on', Boolean(it.clean) && !it.blur.length);
  stage.classList.toggle('is-skipped', Boolean(it.skip));

  photo.onload = renderBoxes;
  if (photo.src.endsWith(it.file)) renderBoxes();
  else photo.src = IMG[curKind()] + it.file;
}

/** Отмечает текущий файл как изменённый. */
function mark() {
  touched[curKind()].add(item().file);
  dirty = true;
}

/* ---------- Рисование рамки ---------- */
let drag = null;

stage.addEventListener('pointerdown', (e) => {
  if (e.target.classList.contains('box')) return;
  const rect = photo.getBoundingClientRect();
  drag = {
    x0: e.clientX - rect.left,
    y0: e.clientY - rect.top,
    rect,
    div: Object.assign(document.createElement('div'), { className: 'box' }),
  };
  stage.append(drag.div);
  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const x = e.clientX - drag.rect.left;
  const y = e.clientY - drag.rect.top;
  Object.assign(drag.div.style, {
    left: `${Math.min(drag.x0, x)}px`,
    top: `${Math.min(drag.y0, y)}px`,
    width: `${Math.abs(x - drag.x0)}px`,
    height: `${Math.abs(y - drag.y0)}px`,
  });
});

stage.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const x = e.clientX - drag.rect.left;
  const y = e.clientY - drag.rect.top;
  const w = photo.clientWidth;
  const h = photo.clientHeight;

  const left = Math.min(drag.x0, x);
  const top = Math.min(drag.y0, y);
  const width = Math.abs(x - drag.x0);
  const height = Math.abs(y - drag.y0);
  drag.div.remove();
  drag = null;

  if (width < 6 || height < 6) return;

  const it = item();
  it.blur.push({
    x: +Math.max(0, left / w).toFixed(4),
    y: +Math.max(0, top / h).toFixed(4),
    w: +Math.min(1, width / w).toFixed(4),
    h: +Math.min(1, height / h).toFixed(4),
  });
  // Появилась рамка — картинка уже не «чистая».
  it.clean = false;
  it.skip = false;
  mark();
  render();
});

/* ---------- Навигация и сохранение ---------- */
function go(delta) {
  const next = idx + delta;
  if (next < 0 || next >= items.length) return;
  idx = next;
  render();
}

/** Готовит marks для набора: файл → массив рамок | 'clean' | 'skip'. */
function marksFor(kind) {
  const marks = {};
  for (const file of touched[kind]) {
    const it = sets[kind].find((x) => x.file === file);
    if (!it) continue;
    if (it.skip) marks[file] = 'skip';
    else if (it.blur.length) marks[file] = it.blur.map((r) => [r.x, r.y, r.w, r.h]);
    else marks[file] = 'clean';
  }
  return marks;
}

async function save() {
  $('saveState').textContent = 'Сохраняю…';
  try {
    let total = 0;
    for (const kind of ['icon', 'shot']) {
      if (!touched[kind].size) continue;
      const res = await fetch('/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kind, marks: marksFor(kind) }),
      });
      const out = await res.json();
      if (!out.ok) throw new Error(out.error ?? 'ошибка');
      total += out.saved;
      touched[kind].clear();
    }
    dirty = false;
    $('saveState').textContent = `Сохранено (${total})`;
    setTimeout(() => { $('saveState').textContent = ''; }, 2500);
  } catch (e) {
    $('saveState').textContent = `Ошибка: ${e.message}`;
  }
}

/** Брак: картинка не подходит (кривой арт, чужая игра). */
function toggleSkip() {
  const it = item();
  it.skip = !it.skip;
  if (it.skip) it.clean = false;
  mark();
  if (it.skip && idx < items.length - 1) go(1);
  else render();
}

/** «Без правок»: название не видно, замазывать нечего. */
function toggleClean() {
  const it = item();
  it.clean = !it.clean;
  if (it.clean) { it.skip = false; it.blur = []; }
  mark();
  if (it.clean && idx < items.length - 1) go(1);
  else render();
}

$('prev').addEventListener('click', () => go(-1));
$('next').addEventListener('click', () => go(1));
$('save').addEventListener('click', save);
$('skip').addEventListener('click', toggleSkip);
$('clean').addEventListener('click', toggleClean);
$('tier').addEventListener('change', applyFilter);
$('kind').addEventListener('change', applyFilter);

window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'ArrowRight') go(1);
  else if (e.key.toLowerCase() === 'x') toggleSkip();
  else if (e.key.toLowerCase() === 'c') toggleClean();
  else if (e.key.toLowerCase() === 's' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
});

window.addEventListener('resize', () => { if (items.length) renderBoxes(); });
window.addEventListener('beforeunload', (e) => { if (dirty) e.preventDefault(); });

load();
</script>
</body>
</html>
